[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forever-chronicle"
version = "0.1.0"
description = "Desktop companion for the Forever Chronicle WoW Forever addon"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forever-chronicle = "forever_chronicle.app:main"

[tool.setuptools.packages.find]
include = ["forever_chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
