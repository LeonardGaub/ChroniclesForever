[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forever-chronicle"
version = "0.1.0"
description = "Desktop companion for the Journey Forever WoW Forever addon"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["numpy>=1.26", "soundfile>=0.12", "pillow>=10"]   # tools/generate_sounds.py, tools/extract_maps.py

[project.scripts]
forever-chronicle = "forever_chronicle.app:main"

[tool.setuptools.packages.find]
include = ["forever_chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
