[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forever-chronicle"
version = "0.1.0"
description = "Desktop companion for the Journey Forever WoW Forever addon"
requires-python = ">=3.11"
# numpy and Pillow read the game files (wow/casc.py, wow/game_icons.py); the app runs without them, with symbols
# instead of the icons recorded per event. "Journey Forever starten.bat" installs the same list.
dependencies = ["PySide6>=6.6", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["soundfile>=0.12"]   # tools/generate_sounds.py (tools/extract_maps.py, extract_icons.py: the main list)

[project.scripts]
forever-chronicle = "forever_chronicle.app:main"

[tool.setuptools.packages.find]
include = ["forever_chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
